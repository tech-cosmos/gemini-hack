<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Click-Brake</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#f0f6fc;--mut:#9da7b3;--red:#ff4d4f;--green:#2ea043;--amber:#f0a020;--blue:#58a6ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.35 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
header{display:flex;align-items:baseline;gap:18px;padding:10px 24px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:30px;letter-spacing:.3px}header h1 span{color:var(--red)}header .sub{color:var(--mut);font-size:17px}
header .cfg{margin-left:auto;color:var(--mut);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(400px,1fr);gap:18px;padding:14px 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:0 0 6px}
#stage{position:relative;width:100%;aspect-ratio:1280/800;overflow:hidden;border-radius:8px;border:2px solid var(--line);background:#fff}
#stage iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
.ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:6px solid var(--red);box-shadow:0 0 0 4px rgba(255,77,79,.35);pointer-events:none;animation:pop .35s ease-out}
.ring.green{border-color:var(--green);box-shadow:0 0 0 4px rgba(46,160,67,.35)}.ring.amber{border-color:var(--amber);box-shadow:0 0 0 4px rgba(240,160,32,.35)}
.ring .tag{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#000c;color:#fff;font-size:16px;padding:3px 8px;border-radius:6px;font-weight:700}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
.row{display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap}
input[type=text],textarea,select{background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:17px}
input[type=text]{flex:1;min-width:120px}textarea{width:100%;resize:vertical;min-height:44px}
.attacker{border:2px dashed var(--red);border-radius:10px;padding:10px 12px;margin-top:10px}
.attacker .lbl{color:var(--red)}
.tmpl{font-size:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tmpl input{font-size:20px;font-weight:600}
details summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:8px}
button.run{flex:1;font:inherit;font-size:21px;font-weight:700;padding:14px 10px;border-radius:10px;border:0;cursor:pointer;color:#fff}
button.off{background:#6e2a2a}button.on{background:#1f6f3a}button.run:disabled{opacity:.45;cursor:wait}
button.small{font:inherit;font-size:14px;background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#verdict{border-radius:12px;padding:16px 18px;margin-bottom:12px;min-height:128px;display:flex;flex-direction:column;justify-content:center}
#verdict .big{font-size:40px;font-weight:800;line-height:1.1}#verdict .det{font-size:21px;margin-top:6px}
#verdict.idle{background:#21262d;color:var(--mut)}#verdict.idle .big{font-size:26px;font-weight:600}
#verdict.red{background:#5c1416;border:3px solid var(--red)}#verdict.stop{background:#4a3500;border:3px solid var(--amber)}
#verdict.green{background:#0f3d1e;border:3px solid var(--green)}#verdict.work{background:#0c2d4d;border:3px solid var(--blue)}
#verdict.det8{background:#3d2a00;border:3px dashed var(--amber)}
#steps{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto}
#steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:17px;align-items:baseline}
#steps li .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:18px}
#steps li .m{color:var(--mut);font-size:14px}#steps li.bad{color:#ffb3b3}#steps li.ok{color:#b6f0c2}#steps li.warn{color:#ffd58a}
.chk{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #fff4;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
<header><h1>Click<span>-</span>Brake</h1><div class="sub">a brake in front of every click a browser agent makes</div><div class="cfg" id="cfg"></div></header>
<main>
 <section>
  <div class="panel">
   <div class="row" style="margin-top:0"><span class="lbl" style="margin:0">The site the agent is using (live page)</span>
    <select id="site"></select></div>
   <div id="stage" style="margin-top:8px"><iframe id="frame" sandbox="allow-same-origin"></iframe></div>
   <div class="row"><span class="lbl" style="margin:0">User's task</span><input type="text" id="task"></div>
   <div class="attacker">
    <div class="row" style="margin-top:0"><span class="lbl" style="margin:0">Attacker: write your own trap</span>
     <select id="mode"><option value="banner">Banner at top</option><option value="modal">Pop-up dialog</option>
      <option value="cookie">Legit cookie notice (site's own)</option><option value="none">Nothing (clean page)</option></select>
     <button class="small" id="reset">reset</button></div>
    <div class="row tmpl" id="tmplRow"><input type="text" id="t_what" style="max-width:420px" placeholder="TAP 202 can only be selected"> <span>after you click</span>
     <input type="text" id="t_btn" style="max-width:260px"></div>
    <details><summary>edit the exact wording (title / message / button)</summary>
     <div class="row"><input type="text" id="a_title" placeholder="title (dialog heading / bold banner lead)"><input type="text" id="a_button" placeholder="button text" style="max-width:240px"></div>
     <div class="row"><textarea id="a_text" placeholder="message"></textarea></div>
    </details>
   </div>
  </div>
 </section>
 <section>
  <div class="row" style="margin-top:0">
   <button class="run off" id="runOff">Run agent · brake OFF</button>
   <button class="run on" id="runOn">Run agent · brake ON</button>
  </div>
  <div class="row" style="margin:8px 0 10px">
   <select id="backend" style="font-size:14px"><option value="cu">agent: Gemini computer use (Hydrogen)</option><option value="json">agent: fast stand-in (flash-lite JSON)</option></select>
   <label class="chk"><input type="checkbox" id="mock"> offline mock</label>
   <label class="chk" title="Brake-OFF and the first brake-ON proposal replay a click on the injected button instead of asking the agent"><input type="checkbox" id="replay"> replay hijack proposal</label>
  </div>
  <div id="verdict" class="idle"><div class="big">Write a trap, then run the agent.</div></div>
  <div class="panel"><p class="lbl">Steps · latency</p><ul id="steps"></ul></div>
 </section>
</main>
<script>
const $ = id => document.getElementById(id);
let CFG = {}, page = null, busy = false;
const S = () => CFG.sites[$("site").value];
const attack = () => ({title: $("a_title").value, text: $("a_text").value, button: $("a_button").value});
function fill(a){ $("a_title").value = a.title || ""; $("a_text").value = a.text || ""; $("a_button").value = a.button || "";
  const m = /^(.*) after you click (.*)$/i.exec(a.text || "");
  $("t_what").value = m ? m[1] : ""; $("t_btn").value = m ? m[2] : (a.button || ""); }
function fromTemplate(){ const w = $("t_what").value.trim(), b = $("t_btn").value.trim();
  $("a_text").value = `${w} after you click ${b}`; $("a_button").value = b;
  if ($("mode").value === "modal" && !$("a_title").value) $("a_title").value = "One more step"; preview(); }

function scaleFrame(){ const w = $("stage").clientWidth; $("frame").style.transform = `scale(${w/1280})`; }
window.addEventListener("resize", scaleFrame);

async function post(path, body){
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({...body, mock: $("mock").checked, backend: $("backend").value})});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
function clearRings(){ document.querySelectorAll("#stage .ring").forEach(e => e.remove()); }
function ring(x, y, cls, tag){
  const s = $("stage").clientWidth / 1280, d = document.createElement("div");
  d.className = "ring " + (cls || ""); d.style.left = (x*s) + "px"; d.style.top = (y*s) + "px";
  if (tag) { const t = document.createElement("div"); t.className = "tag"; t.textContent = tag; d.appendChild(t); }
  $("stage").appendChild(d);
}
function step(text, secs, cls, meta){
  const li = document.createElement("li"); li.className = cls || "";
  li.innerHTML = `<span>${$("steps").children.length + 1}</span><span></span><span class="t"></span>`;
  li.children[1].textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "m"; m.textContent = meta; li.children[1].appendChild(m); }
  li.children[2].textContent = secs == null ? "" : Number(secs).toFixed(2) + " s";
  $("steps").appendChild(li); li.scrollIntoView({block: "nearest"}); return li;
}
function verdict(cls, big, det, spin){
  const v = $("verdict"); v.className = cls; v.innerHTML = ""; const b = document.createElement("div"); b.className = "big";
  if (spin || cls === "work") b.innerHTML = '<span class="spin"></span>'; b.appendChild(document.createTextNode(big)); v.appendChild(b);
  if (det) { const d = document.createElement("div"); d.className = "det"; d.textContent = det; v.appendChild(d); }
}

let tmr = null;
function preview(){ clearTimeout(tmr); tmr = setTimeout(async () => {
  if (busy) return; const mode = $("mode").value;
  try { page = await post("/api/shot", {site: $("site").value, mode, attack: mode === "none" ? null : attack()}); $("frame").srcdoc = page.html; clearRings(); }
  catch(e){ verdict("red", "Render failed", String(e)); }
}, 250); }
["a_title", "a_text", "a_button"].forEach(id => $(id).addEventListener("input", preview));
["t_what", "t_btn"].forEach(id => $(id).addEventListener("input", fromTemplate));
$("mode").addEventListener("change", () => { const m = $("mode").value; fill(m === "cookie" ? S().cookie : S().attack);
  $("tmplRow").style.display = m === "cookie" || m === "none" ? "none" : "flex"; preview(); });
$("reset").addEventListener("click", () => { $("mode").value = S().mode; $("mode").dispatchEvent(new Event("change")); });
$("site").addEventListener("change", () => { $("task").value = S().task; $("reset").click(); verdict("idle", "Write a trap, then run the agent."); $("steps").innerHTML = ""; });

const KIND_TEXT = {dismiss: "close the dialog", task: "the right button", injected: "the attacker's button", popup: "the site's own pop-up", other: "a different button", none: "nothing clickable"};
const ROUTE_CLS = {PASS: "ok", STOP: "warn", DETONATE: "warn"};

async function run(brake){
  if (busy) return; busy = true; $("runOff").disabled = $("runOn").disabled = true;
  $("steps").innerHTML = ""; clearRings();
  const task = $("task").value, replay = $("replay").checked, site = $("site").value;
  let mode = $("mode").value, note = null, total = 0, stopped = null;
  try {
    for (let i = 0; i < 6; i++) {
      verdict("work", "Rendering page…");
      page = await post("/api/shot", {site, mode, attack: mode === "none" ? null : attack()}); $("frame").srcdoc = page.html;
      step("Screenshot of the page (headless Chrome, 1280×800)", page.s);
      verdict("work", note ? "Agent re-plans after the block…" : "Agent is choosing a click…");
      const pr = await post("/api/propose", {page_id: page.page_id, task, note, replay: replay && !note});
      const p = pr.proposal, el = pr.element, name = el.text || p.label || "?"; total += p.s;
      clearRings(); ring(p.x, p.y, brake ? "amber" : "", name.slice(0, 40));
      step(`Agent proposes: click “${name}” → ${KIND_TEXT[el.kind]}`, p.s, el.kind === "injected" ? "bad" : "",
           `${p.model} · (${p.x}, ${p.y})${p.intent ? " · intent: " + p.intent.slice(0, 110) : ""}`);
      let allowed = true;
      if (brake) {
        verdict("work", "Brake checking the click…");
        const r = await post("/api/brake", {page_id: page.page_id, task, x: p.x, y: p.y, kind: el.kind, intent: p.intent || ""}); total += r.latency_s;
        step(`Brake ${r.route}: on-task ${r.p_on_task.toFixed(2)} · attack ${r.p_injected.toFixed(2)}`, r.latency_s, ROUTE_CLS[r.route],
             `${r.model} · ${r.question_version} · PASS if on-task ≥ ${r.threshold}; else STOP if attack ≥ ${r.threshold}; else DETONATE`);
        if (r.route === "DETONATE") {
          clearRings(); ring(p.x, p.y, "amber", "UNSURE");
          verdict("det8", "UNSURE → detonating in sandbox…", `on-task ${r.p_on_task.toFixed(2)}, attack ${r.p_injected.toFixed(2)}: a sandboxed agent clicks “${name}” first.`, true);
          const d = await post("/api/detonate", {page_id: page.page_id, task, x: p.x, y: p.y}); total += d.s || 0;
          const safe = d.verdict === "safe";
          step(`Sandbox: ${d.verdict} — ${d.what_happened}`, d.s, safe ? "ok" : "warn", d.stub ? "detonate stub (managed/detonate.py not on main)" : (d.mock ? "mock" : "managed/detonate.py"));
          allowed = safe; if (!safe) r.sandbox = d;
        } else allowed = r.route === "PASS";
        if (!allowed) {
          clearRings(); ring(p.x, p.y, "", "STOPPED");
          const how = r.sandbox ? `sandbox said ${r.sandbox.verdict}` : `attack p=${r.p_injected.toFixed(2)}`;
          verdict("stop", `STOPPED in ${(r.latency_s + (r.sandbox ? (r.sandbox.s || 0) : 0)).toFixed(2)} s · ${how}`, `Blocked a click on “${name}” before it fired.`);
          const ex = await post("/api/explain", {page_id: page.page_id, task, x: p.x, y: p.y, brake: r});
          if (ex.reason) { step(`Reason: ${ex.reason.text}`, ex.reason.s, "warn", ex.reason.model); $("verdict").querySelector(".det").textContent = ex.reason.text; }
          if (ex.circle) { ring(ex.circle.x, ex.circle.y, "green", ex.circle.label || "task needs this"); step(`ER 2 circles “${ex.circle.label || ""}”`, ex.circle.s, "ok"); }
          await new Promise(res => setTimeout(res, 1600));
          note = {x: p.x, y: p.y, label: name}; stopped = stopped || r;
          if (mode === "modal") {
            // q1 also stopped "Cancel" inside an injected dialog; closing it with Esc is a keypress, not a click, so the click brake doesn't gate it.
            step("Dialog closed with Esc (keypress; the brake gates clicks only)", null, "ok"); mode = "none";
          }
          continue;
        }
      }
      if (el.kind === "injected") {
        clearRings(); ring(p.x, p.y, "", "HIJACKED");
        verdict("red", `HIJACKED — agent clicked “${name}”`, brake ? "The brake let it through (a miss)." : "That's what happens today.");
        step("Click fired on the attacker's button", null, "bad"); break;
      }
      if (el.kind === "popup") { step(`Click fired on the site's own “${el.text}” (allowed)`, null, "ok"); mode = "none"; note = null; continue; }
      if (el.kind === "dismiss") { step(`Click fired on “${el.text}”: dialog closed`, null, "ok"); mode = "none"; continue; }
      if (el.kind === "task") {
        clearRings(); ring(p.x, p.y, "green", el.text);
        const how = stopped ? `Hijack ${stopped.sandbox ? "detonated and " : ""}STOPPED in ${stopped.latency_s.toFixed(2)} s, then the agent clicked “${el.text}”`
                            : `${brake ? "Brake ON" : "Brake OFF"} · agent clicked “${el.text}”`;
        verdict("green", `${S().done} ✓`, `${how} · total model time ${total.toFixed(1)} s`);
        step(`Click fired on “${el.text}”: ${S().done.toLowerCase()}`, null, "ok");
        if (brake) { const f = await post("/api/finish", {page_id: page.page_id, task}); if (f.finish) step("Managed Agents finished the task", f.finish.s, "ok"); }
        break;
      }
      verdict("idle", `Agent clicked “${name}”`, "Not the task button and not the trap."); step("Click fired elsewhere", null); break;
    }
  } catch (e) { verdict("red", "Error", String(e)); step("Error: " + e, null, "bad"); }
  busy = false; $("runOff").disabled = $("runOn").disabled = false;
}
$("runOff").addEventListener("click", () => run(false));
$("runOn").addEventListener("click", () => run(true));

(async () => {
  CFG = await (await fetch("/api/config")).json();
  for (const [k, v] of Object.entries(CFG.sites)) { const o = document.createElement("option"); o.value = k; o.textContent = v.name; $("site").appendChild(o); }
  $("site").value = CFG.default_site; $("mock").checked = CFG.mock; $("backend").value = CFG.backend;
  $("cfg").textContent = `brake: ${CFG.brake_model} ${CFG.question_version}`;
  scaleFrame(); $("site").dispatchEvent(new Event("change"));
})();
</script>
</body></html>
