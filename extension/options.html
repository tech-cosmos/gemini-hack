<!doctype html>
<html><head><meta charset="utf-8"><title>Click-Brake options</title>
<style>body{font:14px system-ui;max-width:560px;margin:30px auto;color:#111}label{display:block;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=password],textarea{width:100%;box-sizing:border-box;padding:7px;font:inherit}.note{color:#555;font-size:12px}
button{margin-top:16px;padding:8px 16px;font:inherit}#saved{color:#1a7f37;margin-left:10px}</style></head>
<body>
<h2>Click-Brake</h2>
<label><input type="checkbox" id="enabled"> Brake every click on every page</label>
<label for="task">Current task (what you or your agent is trying to do)</label>
<textarea id="task" rows="2" placeholder="Place the order for the headphones in my cart."></textarea>
<label for="apiUrl">Brake API URL</label>
<input type="text" id="apiUrl" placeholder="http://localhost:8766">
<label for="apiKey">Your own Gemini API key (optional)</label>
<input type="password" id="apiKey" autocomplete="off" placeholder="leave empty to use the API server's key">
<div class="note">Stored in this browser only (chrome.storage.local). It is sent nowhere except to the API URL above, as the
  <code>X-Gemini-Key</code> header, and that server uses it for your request only.</div>
<label><input type="checkbox" id="detonate"> Use Managed Agents detonation for unsure clicks (slow: 40–95 s)</label>
<button id="save">Save</button><span id="saved"></span>
<script src="options.js"></script>
</body></html>
